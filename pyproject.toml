[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsn-lead-engine"
dynamic = ["version"]
description = "Zero-paid-API US + Canada business lead engine"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.37,<2",
  "duckdb>=1.5.5,<2",
  "google-api-python-client>=2.149,<3",
  "google-auth>=2.35,<3",
  "phonenumbers>=8.13,<10",
  "requests>=2.32,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
vsn-lead-engine = "vsn_lead_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "vsn_lead_engine.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
