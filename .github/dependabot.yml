version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 4
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:15"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 4
    versioning-strategy: "increase-if-necessary"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Karachi"
    open-pull-requests-limit: 4
    groups:
      next-runtime:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
