name: SaaS Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["apps/saas/**", ".github/workflows/saas-quality.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saas-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lead_saas
          POSTGRES_USER: lead_saas
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lead_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAAS_SECRET_KEY: disposable-ci-key-not-a-deployment-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      SAAS_DEBUG: "1"
      SAAS_DB_NAME: lead_saas
      SAAS_DB_USER: lead_saas
      SAAS_DB_PASSWORD: disposable-ci-only
      SAAS_DB_HOST: 127.0.0.1
      SAAS_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/saas/requirements-dev.txt
      - run: python -m pip install --require-hashes -r apps/saas/requirements-dev.txt
      - run: ruff check --config apps/saas/ruff.toml apps/saas
      - run: ruff format --check --config apps/saas/ruff.toml apps/saas
      - run: python -m compileall -q apps/saas
      - run: python -m pip check
      - run: python apps/saas/manage.py check
      - run: python apps/saas/manage.py makemigrations --check --dry-run
      - run: python apps/saas/manage.py migrate --noinput
      - run: python apps/saas/manage.py test core --verbosity=2
      - name: Verify reversible initial migration
        run: |
          python apps/saas/manage.py migrate core zero --noinput
          python apps/saas/manage.py migrate --noinput
      - name: Check production settings
        env:
          SAAS_DEBUG: "0"
        run: python apps/saas/manage.py check --deploy --fail-level WARNING
