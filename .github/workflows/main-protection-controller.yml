name: Main Protection Controller

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply/repair the repository main-branch ruleset"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/main-protection-ruleset.json"
      - ".github/workflows/main-protection-controller.yml"
      - "scripts/github_ruleset_common.py"
      - "scripts/apply_main_protection.py"
      - "scripts/verify_main_protection.py"
  schedule:
    - cron: "15 1 * * *"

permissions:
  contents: read

concurrency:
  group: vsn-lead-engine-main-protection
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate policy document
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy=json.loads(
              Path(".github/main-protection-ruleset.json").read_text(encoding="utf-8")
          )
          assert policy["name"]=="VSN Main Protection"
          assert policy["target"]=="branch"
          assert policy["enforcement"]=="active"
          assert policy["conditions"]["ref_name"]["include"]==["refs/heads/main"]
          print("Main protection policy is structurally valid.")
          PY

      - name: Detect admin credential
        id: admin
        shell: bash
        run: |
          if [ -n "$GITHUB_ADMIN_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_ADMIN_TOKEN is not configured; live protection mutation cannot run."
          fi

      - name: Apply or self-heal live ruleset
        if: ${{ steps.admin.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply) }}
        run: python scripts/apply_main_protection.py --confirm

      - name: Apply repository merge settings
        if: ${{ steps.admin.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply) }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -F allow_merge_commit=false \
            -F allow_rebase_merge=false \
            -F allow_squash_merge=true \
            -F allow_auto_merge=true \
            -F allow_update_branch=true \
            -F delete_branch_on_merge=true >/tmp/repository-settings.json

      - name: Verify live ruleset
        if: ${{ steps.admin.outputs.ready == 'true' }}
        run: python scripts/verify_main_protection.py

      - name: Verify repository merge settings
        if: ${{ steps.admin.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(gh api "repos/${GITHUB_REPOSITORY}")"
          test "$(jq -r '.allow_merge_commit' <<<"$SETTINGS")" = "false"
          test "$(jq -r '.allow_rebase_merge' <<<"$SETTINGS")" = "false"
          test "$(jq -r '.allow_squash_merge' <<<"$SETTINGS")" = "true"
          test "$(jq -r '.allow_auto_merge' <<<"$SETTINGS")" = "true"
          test "$(jq -r '.allow_update_branch' <<<"$SETTINGS")" = "true"
          test "$(jq -r '.delete_branch_on_merge' <<<"$SETTINGS")" = "true"
          echo "Repository merge settings match ANPOS policy."

      - name: Dispatch governance audit after self-heal
        if: ${{ steps.admin.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run governance-audit.yml --repo "${GITHUB_REPOSITORY}" --ref main

      - name: Report unavailable live verification
        if: ${{ steps.admin.outputs.ready != 'true' }}
        shell: bash
        run: |
          python scripts/verify_main_protection.py --allow-missing-token
          echo "::error::GH_ADMIN_TOKEN is required before P12 live enforcement can be certified."
          exit 2
