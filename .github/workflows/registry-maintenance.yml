name: Registry Maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/registry-maintenance-trigger"

permissions:
  contents: read

concurrency:
  group: vsn-lead-registry-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate runtime configuration
        run: python -m vsn_lead_engine.cli validate
      - name: Credential presence
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON missing"; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo "::error::R2_ACCOUNT_ID missing"; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "::error::R2_ACCESS_KEY_ID missing"; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "::error::R2_SECRET_ACCESS_KEY missing"; exit 1; }
          test -n "$R2_BUCKET" || { echo "::error::R2_BUCKET missing"; exit 1; }
      - name: Resolve requested maintenance action
        id: action
        shell: bash
        run: |
          action="$(head -n 1 .github/registry-maintenance-trigger | tr -d '\r\n ' | tr '[:upper:]' '[:lower:]')"
          case "$action" in
            check|dry-backfill|backfill|audit|stats|migrate|smoke) ;;
            *) echo "::error::Unsupported registry maintenance action: $action"; exit 2 ;;
          esac
          echo "value=$action" >> "$GITHUB_OUTPUT"
      - name: R2 connectivity check
        if: ${{ steps.action.outputs.value == 'check' }}
        run: python -m vsn_lead_engine.cli registry-check
      - name: Registry backfill dry run
        if: ${{ steps.action.outputs.value == 'dry-backfill' }}
        run: python -m vsn_lead_engine.cli registry-backfill --dry-run
      - name: Registry backfill
        if: ${{ steps.action.outputs.value == 'backfill' }}
        run: python -m vsn_lead_engine.cli registry-backfill
      - name: Registry audit
        if: ${{ steps.action.outputs.value == 'audit' }}
        run: python -m vsn_lead_engine.cli registry-audit
      - name: Registry stats
        if: ${{ steps.action.outputs.value == 'stats' }}
        run: python -m vsn_lead_engine.cli registry-stats
      - name: Full R2 migration and exact audit
        if: ${{ steps.action.outputs.value == 'migrate' }}
        run: python -m vsn_lead_engine.cli registry-migrate
      - name: Live isolated R2 transaction smoke test
        if: ${{ steps.action.outputs.value == 'smoke' }}
        run: python -m vsn_lead_engine.cli registry-smoke
