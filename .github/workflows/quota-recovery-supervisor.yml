name: Lead Engine Recovery Supervisor

on:
  workflow_run:
    workflows: ["Lead Engine"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/10 3-18 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: vsn-lead-engine-recovery-supervisor
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'schedule' || github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/install_locked.py

      - name: Google credential preflight
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_OAUTH_USER_JSON" ] || [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Recovery supervisor skipped: Google credential unavailable."
          fi

      - name: Recovery window gate
        id: window
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          from vsn_lead_engine.schedule import scheduled_run_window

          with open("config/runtime.json", encoding="utf-8") as handle:
              config=json.load(handle)

          runtime=config["runtime"]
          enabled=bool(runtime.get("recovery_supervisor_enabled",True))
          gate=scheduled_run_window(config)
          allowed=enabled and bool(gate["allowed"])

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
              output.write(f"allowed={str(allowed).lower()}\n")
              output.write(f"run_date={gate['run_date']}\n")
              output.write(
                  f"seconds_until_midnight={gate['seconds_until_midnight']}\n"
              )
              output.write(
                  f"required_runway_seconds={gate['required_runway_seconds']}\n"
              )
              output.write(f"block_reason={gate.get('block_reason') or ''}\n")

          print(
              "Recovery window: "
              f"enabled={enabled} allowed={allowed} "
              f"local={gate['local_time']} status={gate['status']} "
              f"seconds_until_midnight={gate['seconds_until_midnight']} "
              f"required_runway_seconds={gate['required_runway_seconds']} "
              f"block_reason={gate.get('block_reason')}"
          )
          PY

      - name: Record blocked recovery schedule gate
        if: ${{ steps.window.outputs.enabled == 'true' && steps.window.outputs.allowed != 'true' }}
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m vsn_lead_engine.cli health-schedule-gate \
            --origin recovery-supervisor

      - name: Check live daily quota
        id: quota
        if: ${{ steps.google.outputs.ready == 'true' && steps.window.outputs.allowed == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -m vsn_lead_engine.cli workbook-ready-recover --attempts 3 --delay-seconds 20)"
          printf '%s\n' "$payload"
          complete="$(printf '%s' "$payload" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("quota_complete",False))).lower())')"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

      - name: Check for active real Lead Engine run
        id: active
        if: ${{ steps.quota.outputs.complete == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/lead-engine.yml/runs?per_page=100" \
              --jq '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending") and .head_branch == "main" and .event != "pull_request")] | length'
          )"
          echo "count=$active" >> "$GITHUB_OUTPUT"
          echo "Active/queued real Lead Engine runs: $active"

      - name: Dispatch shortfall recovery
        if: ${{ steps.quota.outputs.complete == 'false' && steps.active.outputs.count == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run lead-engine.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f dry_run=false             -f run_origin=recovery-supervisor
          echo "Dispatched one serialized recovery run for remaining daily quota."

      - name: Quota complete
        if: ${{ steps.quota.outputs.complete == 'true' }}
        run: echo "Daily category quotas are complete; recovery chain stops."

      - name: Recovery already queued
        if: ${{ steps.quota.outputs.complete == 'false' && steps.active.outputs.count != '0' }}
        run: echo "A real Lead Engine run is already queued/in progress; duplicate dispatch skipped."
