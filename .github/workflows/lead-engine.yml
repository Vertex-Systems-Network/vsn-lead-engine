name: Lead Engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/lead-run-trigger"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run discovery without Google writes"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 3-18 * * *"

permissions:
  contents: read

concurrency:
  group: vsn-lead-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m vsn_lead_engine.cli validate
      - run: pytest -q

  run:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Credential preflight
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Google credential preflight: ready"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_SERVICE_ACCOUNT_JSON is not configured; real lead run skipped safely."
          fi
      - name: Scheduled real run
        if: ${{ github.event_name == 'schedule' && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m vsn_lead_engine.cli run
      - name: Assistant-triggered real run
        if: ${{ github.event_name == 'push' && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m vsn_lead_engine.cli run
      - name: Manual dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m vsn_lead_engine.cli run --dry-run
      - name: Manual real run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m vsn_lead_engine.cli run
      - name: Real run blocked safely
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.google.outputs.ready != 'true' }}
        run: echo "Lead collection is approved, but Google credential is not configured yet. No writes were attempted."
