name: Lead Engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/lead-run-trigger"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run discovery without Google writes"
        required: true
        default: true
        type: boolean
      run_origin:
        description: "Origin label for real workflow_dispatch runs"
        required: true
        default: manual
        type: choice
        options:
          - manual
          - recovery-supervisor
  schedule:
    - cron: "0 3-18 * * *"

permissions:
  contents: read

concurrency:
  group: vsn-lead-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.txt -e ".[dev]"
      - name: Resolve P59 artifact hashes
        shell: bash
        run: |
          python -m pip install --dry-run --ignore-installed --report runtime-report.json -c requirements.txt -e .
          python -m pip install --dry-run --ignore-installed --report dev-report.json -c requirements.txt -e ".[dev]"
          python -m pip install --dry-run --ignore-installed --report bootstrap-report.json "pip==25.2" "setuptools==84.0.0" "wheel==0.48.0"
          python - <<'PY'
          import json
          from pathlib import Path

          def emit(label,path):
              data=json.loads(Path(path).read_text(encoding="utf-8"))
              rows=[]
              for item in data.get("install",[]):
                  metadata=item.get("metadata") or {}
                  name=str(metadata.get("name") or "").strip()
                  version=str(metadata.get("version") or "").strip()
                  if not name or not version or name.lower()=="vsn-lead-engine":
                      continue
                  info=(item.get("download_info") or {}).get("archive_info") or {}
                  hashes=info.get("hashes") or {}
                  sha256=str(hashes.get("sha256") or "").strip()
                  if not sha256:
                      legacy=str(info.get("hash") or "")
                      if legacy.startswith("sha256="):
                          sha256=legacy.split("=",1)[1]
                  if not sha256:
                      raise SystemExit(f"missing sha256 for {name}=={version}")
                  normalized=name.lower().replace("_","-")
                  rows.append((normalized,version,sha256))
              for name,version,sha256 in sorted(set(rows)):
                  print(f"P59_HASH {label} {name}=={version} sha256:{sha256}")

          emit("runtime","runtime-report.json")
          emit("dev","dev-report.json")
          emit("bootstrap","bootstrap-report.json")
          PY
      - run: python -m pip check
      - run: python -m vsn_lead_engine.cli validate
      - run: pytest -q

  run:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.txt -e .
      - name: Dependency integrity preflight
        run: python -m pip check
      - name: Runtime config preflight
        run: python -m vsn_lead_engine.cli validate
      - name: Google credential preflight
        id: google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google credential missing; real lead run skipped safely."
          fi
      - name: R2 registry preflight
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        shell: bash
        run: |
          mode="$(python -c 'import json; print(json.load(open("config/runtime.json"))["registry"]["mode"])')"
          if [ "$mode" != "sheets" ]; then
            python -m vsn_lead_engine.cli registry-check
          fi
      - name: Scheduled real run
        if: ${{ github.event_name == 'schedule' && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m vsn_lead_engine.cli supervised-run --scheduled
      - name: Assistant-triggered real run
        if: ${{ github.event_name == 'push' && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VSN_RUN_ORIGIN: recovery-push
        run: python -m vsn_lead_engine.cli supervised-run
      - name: Manual dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m vsn_lead_engine.cli run --dry-run
      - name: Manual real run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && steps.google.outputs.ready == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VSN_RUN_ORIGIN: ${{ inputs.run_origin }}
        run: python -m vsn_lead_engine.cli supervised-run
      - name: Real run blocked safely
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && steps.google.outputs.ready != 'true' }}
        shell: bash
        run: |
          origin="manual"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            origin="native-schedule"
          elif [ "${{ github.event_name }}" = "push" ]; then
            origin="recovery-push"
          fi
          python -m vsn_lead_engine.cli health-incident \
            --origin "$origin" \
            --error-type "MissingGoogleCredential" \
            --message "GOOGLE_SERVICE_ACCOUNT_JSON unavailable; no lead writes attempted."
