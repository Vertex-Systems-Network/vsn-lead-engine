name: AI Native Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-native-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: repository-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether repository control-plane validation applies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ] && [ "${{ github.event_name }}" != 'push' ]; then
            echo 'control=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if [ "${{ github.event_name }}" = 'push' ]; then base="$BEFORE_SHA"; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo 'control=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(apps/saas/|apps/web/)' >/dev/null; then
            echo 'control=false' >> "$GITHUB_OUTPUT"
            echo 'Only app paths changed; control-plane validation is not affected.'
          else
            echo 'control=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce product-progress stop-loss
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_product_progress.py'
          python scripts/verify_product_progress.py --base "${BASE_SHA}"
          if git cat-file -e "${BASE_SHA}:scripts/verify_product_progress.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/verify_product_progress.py" > scripts/.trusted-base-product-progress.py
            python scripts/.trusted-base-product-progress.py --base "${BASE_SHA}"
            rm -f scripts/.trusted-base-product-progress.py
          fi

      - name: Install pinned ANPOS validation dependencies
        if: steps.scope.outputs.control == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-anpos.txt

      - name: Compile repository scripts and tests
        if: steps.scope.outputs.control == 'true'
        run: python -m compileall -q scripts tests

      - name: Run ANPOS control-plane conformance unit tests
        if: steps.scope.outputs.control == 'true'
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_control_plane.py'
          python -m unittest discover -s tests -p 'test_product_assurance.py'
          python -m unittest discover -s tests -p 'test_governance_assurance.py'
          python -m unittest discover -s tests -p 'test_blueprint_closure.py'

      - name: Verify tamper-evident audit journal
        if: steps.scope.outputs.control == 'true'
        run: python scripts/verify_audit_journal.py

      - name: Validate current AI-native state and workflow safety
        if: steps.scope.outputs.control == 'true'
        run: python scripts/validate_ai_native_repo.py

      - name: Verify autonomous resume and README progress contract
        if: steps.scope.outputs.control == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_autonomy_contract.py'
          if [ -n "${BASE_SHA}" ]; then
            python scripts/verify_readme_progress.py --base "${BASE_SHA}"
          else
            python scripts/verify_readme_progress.py
          fi

      - name: Validate commercial distribution and licensing blueprint when present
        if: steps.scope.outputs.control == 'true'
        shell: bash
        run: |
          if [ -f scripts/validate_commercial_licensing.py ] && [ -f config/licensing/commercial-policy.json ]; then
            python scripts/validate_commercial_licensing.py
          else
            echo "Commercial distribution is not activated for this child development adoption."
          fi

      - name: Run protected-base validators against proposed tree
        if: github.event_name == 'pull_request' && steps.scope.outputs.control == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/validate_ai_native_repo.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_ai_native_repo.py" > scripts/.trusted-base-validator.py
            python scripts/.trusted-base-validator.py
            rm -f scripts/.trusted-base-validator.py
          else
            echo "Base branch predates ANPOS validator; protected-base validation begins after this adoption merge."
          fi

          if git cat-file -e "${BASE_SHA}:scripts/validate_commercial_licensing.py" 2>/dev/null && git cat-file -e "${BASE_SHA}:config/licensing/commercial-policy.json" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/validate_commercial_licensing.py" > scripts/.trusted-base-commercial-validator.py
            python scripts/.trusted-base-commercial-validator.py
            rm -f scripts/.trusted-base-commercial-validator.py
          else
            echo 'Base branch does not activate commercial distribution; protected-base commercial validation is not applicable.'
          fi

      - name: Report control-plane changes for review evidence
        if: github.event_name == 'pull_request' && steps.scope.outputs.control == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD -- \
            AGENTS.md .ai .github blueprints scripts schemas tests config/coordination config/protocol \
            config/security config/consent config/github config/quality config/runtime config/release \
            config/licensing COMMERCIAL-LICENSING.md \
            CONTROL-PLANE-SECURITY.md PRODUCTION-ASSURANCE.md DESIGN-DATA-OPERATIONS.md \
            AUTO-AGENT.md SUPERVISOR.md ORCHESTRATOR.md MULTI-AGENT-ORCHESTRATION.md || true

      - name: Validate YAML syntax
        if: steps.scope.outputs.control == 'true'
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "valid yaml: #{f}" }' \
            .github/dependabot.yml .github/workflows/*.yml

      - name: Reject trailing whitespace in machine/code files
        if: steps.scope.outputs.control == 'true'
        shell: bash
        run: |
          if git grep -nE '[[:blank:]]+$' -- '*.py' '*.json' '*.yml' '*.yaml'; then
            echo 'Trailing whitespace found in machine/code files.' >&2
            exit 1
          fi

      - name: Show repository integrity success
        if: steps.scope.outputs.control == 'true'
        run: echo 'Repository integrity, conformance tests, JSON Schema, core/commercial validators, protected-base validation, workflow pinning, JSON, and YAML checks passed.'
