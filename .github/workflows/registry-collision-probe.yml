name: Motorbikes R2 Collision Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/registry-collision-probe-trigger"

permissions:
  contents: read

concurrency:
  group: vsn-r2-collision-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.txt -e .
      - name: Validate runtime config
        run: python -m vsn_lead_engine.cli validate
      - name: R2 registry preflight
        run: python -m vsn_lead_engine.cli registry-check
      - name: Probe Motorbikes R2 collision rate
        run: >-
          python -m vsn_lead_engine.cli registry-collision-probe
          --max-geographies 4
          --partitions-per-geography 2
