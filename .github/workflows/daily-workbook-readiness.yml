name: Daily Workbook Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "50 2 * * *"

permissions:
  contents: read

concurrency:
  group: vsn-lead-engine-daily-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Runtime config preflight
        run: python -m vsn_lead_engine.cli validate
      - name: Google credential preflight
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is required for daily workbook readiness."
            exit 1
          fi
      - name: Certify today's dated workbook
        run: python -m vsn_lead_engine.cli workbook-ready
