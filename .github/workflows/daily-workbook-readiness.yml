name: Daily Workbook Readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-workbook-readiness.yml"
      - "src/vsn_lead_engine/cli.py"
      - "src/vsn_lead_engine/schedule.py"
      - "src/vsn_lead_engine/health.py"
      - "src/vsn_lead_engine/engine.py"
      - "src/vsn_lead_engine/sheets.py"
  workflow_dispatch:
    inputs:
      target_day:
        description: "Workbook readiness target"
        required: true
        default: "today"
        type: choice
        options:
          - today
          - next-day
  schedule:
    - cron: "50 2 * * *"
    - cron: "50 15 * * *"

permissions:
  contents: read

concurrency:
  group: vsn-lead-engine-production
  queue: max

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_OAUTH_USER_JSON: ${{ secrets.GOOGLE_OAUTH_USER_JSON }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/install_locked.py
      - name: Runtime config preflight
        run: python -m vsn_lead_engine.cli validate

      - name: Resolve readiness target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_TARGET: ${{ inputs.target_day }}
        run: |
          set -euo pipefail
          target="today"
          if [[ "$EVENT_NAME" == "push" ]]; then
            target="next-day"
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_EXPR" == "50 15 * * *" ]]; then
            target="next-day"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_TARGET" == "next-day" ]]; then
            target="next-day"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Recover targeted dated workbook readiness
        id: readiness
        continue-on-error: true
        shell: bash
        env:
          TARGET_DAY: ${{ steps.target.outputs.target }}
        run: |
          set -o pipefail
          args=()
          if [[ "$TARGET_DAY" == "next-day" ]]; then
            args+=(--next-day)
          fi
          python -m vsn_lead_engine.cli workbook-ready-recover \
            "${args[@]}" \
            --attempts 3 \
            --delay-seconds 60 \
            --record-health | tee readiness-result.json

      - name: Publish readiness telemetry
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path=Path("readiness-result.json")
          if not path.exists():
              data={
                  "status":"incident",
                  "run_date":"unknown",
                  "attempts_used":0,
                  "attempts_configured":3,
                  "failures":[{
                      "error_type":"MissingTelemetry",
                      "message":"Readiness command produced no JSON output.",
                  }],
              }
          else:
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  data={
                      "status":"incident",
                      "run_date":"unknown",
                      "attempts_used":0,
                      "attempts_configured":3,
                      "failures":[{
                          "error_type":type(exc).__name__,
                          "message":str(exc),
                      }],
                  }

          status=str(data.get("status","incident"))
          failures=data.get("failures",[]) or []
          summary=[
              "# VSN Daily Workbook Readiness",
              "",
              f"- Status: **{status.upper()}**",
              f"- Target: **{str(data.get('target_kind','today')).upper()}**",
              f"- Run date: `{data.get('run_date','unknown')}`",
              f"- Attempts used: **{data.get('attempts_used',0)} / {data.get('attempts_configured',0)}**",
              f"- Quota already complete: **{bool(data.get('quota_complete',False))}**",
          ]
          workbook=data.get("workbook") or {}
          if workbook:
              summary.append(f"- Workbook: `{workbook.get('name','')}`")
              summary.append(f"- Created by readiness: **{bool(workbook.get('created',False))}**")
          if failures:
              summary.extend(["", "## Recovery attempts"])
              for item in failures:
                  summary.append(
                      f"- Attempt {item.get('attempt','?')}: "
                      f"`{item.get('error_type','Error')}` — "
                      f"{item.get('message','')}"
                  )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(summary)+"\n",
              encoding="utf-8",
          )
          PY

      - name: Enforce readiness gate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("readiness-result.json")
          if not path.exists():
              print("::error::Readiness telemetry file is missing.")
              raise SystemExit(2)
          try:
              data=json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"::error::Readiness telemetry is invalid JSON: {exc}")
              raise SystemExit(2)

          status=data.get("status")
          if status not in {"ready","recovered"}:
              last=data.get("last_error") or {}
              print(
                  "::error::Daily workbook readiness incident after bounded recovery: "
                  f"{last.get('error_type','UnknownError')}: {last.get('message','')}"
              )
              raise SystemExit(2)
          print(
              f"Workbook readiness {status}; "
              f"attempts_used={data.get('attempts_used',1)}."
          )
          PY
