name: Overture Production Source Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/source-probe-trigger"

permissions:
  contents: read

concurrency:
  group: vsn-overture-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate runtime config
        run: python -m vsn_lead_engine.cli validate
      - name: Probe production Motorbikes source path
        run: >-
          python -m vsn_lead_engine.cli source-probe
          --max-geographies 4
          --partitions-per-geography 2
