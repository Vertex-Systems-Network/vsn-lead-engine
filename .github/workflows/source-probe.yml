name: Overture Production Source Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/source-probe-trigger"

permissions:
  contents: read

concurrency:
  group: vsn-overture-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/install_locked.py
      - name: Validate runtime config
        run: python -m vsn_lead_engine.cli validate
      - name: Probe production Motorbikes source path
        run: >-
          python -m vsn_lead_engine.cli source-probe
          --max-geographies 4
          --partitions-per-geography 2
