name: Overture Taxonomy Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/taxonomy-audit-trigger"

permissions:
  contents: read

concurrency:
  group: vsn-taxonomy-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate runtime config
        run: python -m vsn_lead_engine.cli validate
      - name: Audit Motorbikes taxonomy breadth
        run: >-
          python -m vsn_lead_engine.cli taxonomy-audit
          --max-geographies 8
          --rows-per-geography 250
