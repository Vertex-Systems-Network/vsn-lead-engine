name: SaaS Overture Smoke

# Manual live check that a customer job is fulfilled from real Overture Places
# (network + duckdb). Not a PR gate: it depends on an external public dataset.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-overture-smoke
  cancel-in-progress: true

jobs:
  overture-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-runtime.txt
      - run: python -m pip install --require-hashes -r apps/saas/requirements.txt
      - run: python apps/saas/overture_smoke.py
