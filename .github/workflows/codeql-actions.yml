name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '31 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-actions:
    name: analyze-actions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether Actions analysis applies
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ] && [ "${{ github.event_name }}" != 'push' ]; then
            echo 'actions=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if [ "${{ github.event_name }}" = 'push' ]; then base="$BEFORE_SHA"; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo 'actions=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD -- .github | grep -q .; then
            echo 'actions=true' >> "$GITHUB_OUTPUT"
          else
            echo 'actions=false' >> "$GITHUB_OUTPUT"
            echo 'No GitHub Actions configuration changed.'
          fi

      - name: Initialize CodeQL for GitHub Actions
        if: steps.scope.outputs.actions == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          queries: security-extended

      - name: Analyze GitHub Actions
        if: steps.scope.outputs.actions == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions
