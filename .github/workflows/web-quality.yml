name: Web Quality

on:
  pull_request:
    branches: [main]
    paths: ["apps/web/**", "apps/saas/**", ".github/workflows/web-quality.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/saas/**", ".github/workflows/web-quality.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - run: npm run typecheck
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/saas/requirements.txt
      - run: python -m pip install --require-hashes -r ../saas/requirements.txt
      - name: Verify disposable Django and Next HTTP flow
        run: python test/integration_smoke.py
