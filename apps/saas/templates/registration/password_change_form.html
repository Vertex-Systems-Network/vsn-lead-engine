<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password — VSN Lead Engine</title></head>
<body>
<main>
<h1>Change your password</h1>
<p>Enter your current password and choose a new one. Your other signed-in sessions will need to sign in again.</p>
{% if limited %}<p role="alert">Too many password change attempts. Try again in 15 minutes.</p>{% endif %}
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<button type="submit">Change password</button>
</form>
<p><a href="{{ dashboard_url }}">Back to workspaces</a></p>
</main>
</body>
</html>
