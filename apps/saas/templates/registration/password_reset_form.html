<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password — VSN Lead Engine</title></head>
<body><main><h1>Reset your password</h1><p>Enter the email address on your account. If it matches an account, we will send a link to choose a new password.</p>
{% if limited %}<p role="alert">Too many requests. Please try again in 15 minutes.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Send reset link</button></form>
<p><a href="/accounts/login/">Back to sign in</a></p></main></body></html>
